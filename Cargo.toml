[workspace]
resolver = "3"
members = ["crates/common", "crates/client", "crates/server", "crates/mod_api", "crates/mod_host", "mobile"]
# Mods are built separately for WebAssembly (see mods/README.md).
exclude = ["mods"]
# Plain `cargo run` / `cargo build` mean the game. Use --workspace or -p for
# the rest (the server is built as part of the game anyway).
default-members = ["crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ourcraft_common = { path = "crates/common" }
ourcraft_client = { path = "crates/client" }
ourcraft_server = { path = "crates/server" }
ourcraft_mod_api = { path = "crates/mod_api" }
ourcraft_mod_host = { path = "crates/mod_host" }
# Pinned exactly. Default features are off here; the client turns them on,
# while the headless server only needs a few.
bevy = { version = "=0.19.1", default-features = false }
# Networking: renet handles reliable/unreliable channels over any transport;
# renet_netcode is its UDP transport (with connection handshakes).
renet = "2.0"
renet_netcode = "2.0"
# Same version Bevy 0.19 uses, so `Vec3` in `common` *is* Bevy's `Vec3`.
glam = "0.32"

[workspace.lints.clippy]
# Bevy system signatures routinely trip these.
type_complexity = "allow"
too_many_arguments = "allow"

# Bevy is slow when compiled without optimizations. Optimize dependencies fully
# and our own code a little, so debug builds are still playable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Debug info for dependencies takes many gigabytes and is rarely needed.
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
# Drop symbol tables: makes the Android library ~3x smaller.
strip = true
