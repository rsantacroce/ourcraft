# Mods are separate from the game's workspace because they're built for
# WebAssembly. Build them all with `./build.sh` (output in `dist/`).
[workspace]
resolver = "3"
members = ["paint_blocks", "snow_fun", "team_shooter"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Small, fast mods.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
