[package]
name = "ourcraft_common"
description = "Shared types for Ourcraft: blocks, chunks and (later) world generation and protocol."
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately avoids Bevy so it can be shared by the client, the headless
# server and the mod host, and so its tests build and run fast.
[dependencies]
glam.workspace = true
fastnoise-lite = "1.1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
lz4_flex = "0.14"
ourcraft_mod_api.workspace = true

[lints]
workspace = true
