[package]
name = "ourcraft_mod_api"
description = "The Ourcraft mod API: message types shared by the game and mods, plus helpers for writing mods."
version.workspace = true
edition.workspace = true
license.workspace = true

# Kept tiny on purpose: it's compiled into every mod.
[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

[lints]
workspace = true
